[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siege-tower"
version = "0.1.0"
description = "Rules + ATT&CK red-team engagement planner: a standalone app (engine + API + web UI) that plans and documents, and never runs anything."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MooseArsenal / Siege Tower" }]
keywords = ["red-team", "attack-planning", "mitre-attack", "pentest", "roe", "engagement"]
# The planning engine (siege_tower) is dependency-free (standard library only).
# The optional web app adds a thin FastAPI server.
dependencies = []

[project.optional-dependencies]
# The server extra adds the web app and at-rest encryption (cryptography).
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "cryptography>=42.0", "python-multipart>=0.0.9", "python-docx>=1.1", "reportlab>=4.0", "pillow>=10.0", "pyjwt>=2.8"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29", "cryptography>=42.0", "python-multipart>=0.0.9", "python-docx>=1.1", "reportlab>=4.0", "pillow>=10.0", "pyjwt>=2.8"]

[project.scripts]
siege-tower = "siege_tower.cli:main"
siege-tower-server = "server.__main__:main"

[tool.setuptools]
packages = ["siege_tower", "server"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
