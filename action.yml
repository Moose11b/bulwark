name: 'Bulwark DAST Gate'
description: 'Dynamic security scan of a running application as a CI gate. Fails the build on findings and uploads SARIF to the Security tab.'
author: 'moose11b'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target:
    description: 'URL, domain, or IP to scan (e.g. http://localhost:3000)'
    required: true
  profile:
    description: 'Scan profile: headers | web | network | full'
    required: false
    default: 'web'
  fail-on:
    description: 'Fail the build on findings at/above this severity: critical | high | medium | low | never'
    required: false
    default: 'high'
  sarif-file:
    description: 'Path to write SARIF output'
    required: false
    default: 'bulwark-results.sarif'
  upload-sarif:
    description: 'Upload SARIF to the GitHub Security tab'
    required: false
    default: 'true'
  no-enrich:
    description: 'Skip NVD/EPSS/KEV CVE enrichment (faster)'
    required: false
    default: 'false'
  baseline-file:
    description: 'Path (in the workspace) to a previous scan JSON to diff against; findings are marked new/recurring/resolved'
    required: false
    default: ''
  fail-on-new:
    description: 'Gate only on NEW findings vs the baseline — recurring ones report but never fail the build. Requires baseline-file.'
    required: false
    default: 'false'
  suppressions-file:
    description: 'Path (in the workspace) to a suppression file'
    required: false
    default: '.bulwark.yml'

outputs:
  findings-count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.findings-count }}
  new-findings-count:
    description: 'Number of NEW findings vs the baseline (empty when no baseline given)'
    value: ${{ steps.scan.outputs.new-findings-count }}
  highest-severity:
    description: 'Highest severity found'
    value: ${{ steps.scan.outputs.highest-severity }}
  gate-passed:
    description: 'Whether the gate passed (true/false)'
    value: ${{ steps.scan.outputs.gate-passed }}

runs:
  using: 'composite'
  steps:
    - name: Run Bulwark scan
      id: scan
      shell: bash
      run: |
        EXTRA_FLAGS=""
        if [ "${{ inputs.no-enrich }}" = "true" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --no-enrich"; fi
        if [ -n "${{ inputs.baseline-file }}" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --baseline /workspace/${{ inputs.baseline-file }}"
        fi
        if [ "${{ inputs.fail-on-new }}" = "true" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --fail-on-new"; fi
        # The CLI's cwd is inside the container, so its .bulwark.yml
        # auto-discovery can't see the workspace — pass the path explicitly.
        if [ -f "${{ github.workspace }}/${{ inputs.suppressions-file }}" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --suppressions /workspace/${{ inputs.suppressions-file }}"
        fi

        # The runner shell is `bash -e`: without the +e guard a gate failure
        # (exit 1) would kill the script before exit_code was recorded, and
        # the Enforce-gate step would then read an empty value as a pass.
        set +e
        docker run --rm --network host \
          -v "${{ github.workspace }}:/workspace" \
          ghcr.io/moose11b/bulwark-cli:latest \
          scan "${{ inputs.target }}" \
          --profile "${{ inputs.profile }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --sarif "/workspace/${{ inputs.sarif-file }}" \
          --json "/workspace/bulwark-results.json" \
          --markdown "/workspace/bulwark-summary.md" \
          $EXTRA_FLAGS
        SCAN_EXIT=$?
        set -e
        echo "exit_code=$SCAN_EXIT" >> "$GITHUB_OUTPUT"

        # Scan verdict on the workflow run's Summary page
        if [ -f "${{ github.workspace }}/bulwark-summary.md" ]; then
          cat "${{ github.workspace }}/bulwark-summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi

        # Parse summary for outputs (non-fatal if jq/file missing)
        if [ -f "${{ github.workspace }}/bulwark-results.json" ]; then
          COUNT=$(jq '.summary.total' "${{ github.workspace }}/bulwark-results.json" 2>/dev/null || echo 0)
          HIGHEST=$(jq -r '.summary.highest_severity' "${{ github.workspace }}/bulwark-results.json" 2>/dev/null || echo "INFO")
          NEW=$(jq -r '.summary.new // empty' "${{ github.workspace }}/bulwark-results.json" 2>/dev/null || echo "")
          echo "findings-count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "highest-severity=$HIGHEST" >> "$GITHUB_OUTPUT"
          echo "new-findings-count=$NEW" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Upload SARIF to Security tab
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
      continue-on-error: true

    - name: Enforce gate
      shell: bash
      run: |
        if [ "${{ steps.scan.outputs.exit_code }}" = "1" ]; then
          echo "::error::Bulwark gate failed — findings at or above '${{ inputs.fail-on }}' severity."
          echo "gate-passed=false" >> "$GITHUB_OUTPUT"
          exit 1
        elif [ "${{ steps.scan.outputs.exit_code }}" = "2" ]; then
          echo "::error::Bulwark scan errored."
          exit 1
        else
          echo "Bulwark gate passed."
          echo "gate-passed=true" >> "$GITHUB_OUTPUT"
        fi
