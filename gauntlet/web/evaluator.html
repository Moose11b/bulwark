<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauntlet — Evaluator Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="mark"><span>G</span></span>
      <b>Gauntlet</b><small>Evaluator Companion</small>
    </div>
    <div class="bar-actions">
      <a class="btn ghost" href="/">Console</a>
      <a class="btn ghost" href="/rollup.html">Roll-up</a>
      <a class="btn ghost" href="/program.html">Program</a>
      <button class="btn toggle" id="btnTheme" aria-label="Toggle theme">◑</button>
    </div>
  </header>

  <div class="subbar">
    <label>Session <select id="sessionSel"></select></label>
    <label>Observing cell
      <select id="cellSel"></select>
    </label>
    <span class="pill" id="fogPill" hidden></span>
    <button class="btn ghost" id="btnRefresh">Refresh</button>
  </div>

  <main class="companion" id="app">
    <section class="stage" id="evalObjectives">
      <div class="panel"><p class="eyebrow">Pick a session to begin evaluating.</p></div>
    </section>
    <aside class="side">
      <div class="panel">
        <p class="eyebrow">What this cell can see <span class="hint" id="fogHint"></span></p>
        <div id="cellScene" class="cell-scene"><p class="muted">—</p></div>
      </div>
      <div class="panel timeline-panel">
        <p class="eyebrow">Cell timeline</p>
        <ol class="timeline" id="cellTimeline"></ol>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="/evaluator.js"></script>
</body>
</html>
