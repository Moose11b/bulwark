[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# cacheprovider is disabled because /app is a bind mount owned by the host
# user while the container runs as `bulwark`, so the cache dir is unwritable
# and every run emitted three permission warnings.
addopts = -ra --strict-markers --tb=short -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
