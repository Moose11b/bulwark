# Reproducible benchmark: Bulwark vs. OWASP ZAP (baseline) against known
# targets, scored against ground truth where available. Runs on demand and
# weekly; publishes the comparison to the job summary and as an artifact, so
# the numbers in the repo are always machine-produced and reproducible rather
# than hand-written marketing.
name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC
  push:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"

jobs:
  # Fast, dependency-light validation of the scoring logic — runs on every
  # benchmarks/** change without needing Docker or the target images.
  comparator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest benchmarks/test_compare.py -q

  benchmark:
    runs-on: ubuntu-latest
    needs: comparator-tests
    steps:
      - uses: actions/checkout@v5

      - name: Build Bulwark CLI image
        run: docker build -f backend/Dockerfile.cli -t bulwark-cli:bench ./backend

      # ── Target 1: VulnAPI (ground-truth, no external image) ──────
      - name: Start VulnAPI
        run: |
          python3 benchmarks/targets/vulnapi/app.py --host 0.0.0.0 --port 8000 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8000/health >/dev/null; do sleep 1; done'

      - name: Benchmark — VulnAPI
        run: |
          benchmarks/run.sh \
            --target vulnapi \
            --url http://127.0.0.1:8000 \
            --spec benchmarks/targets/vulnapi/openapi.yaml \
            --ground-truth benchmarks/targets/vulnapi/ground_truth.yaml \
            --bulwark-image bulwark-cli:bench \
            --outdir benchmarks/results

      # ── Target 2: OWASP Juice Shop (real-world coverage) ─────────
      - name: Start Juice Shop
        run: |
          docker run -d --name juice -p 3000:3000 bkimminich/juice-shop
          timeout 120 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 3; done'

      - name: Benchmark — Juice Shop
        run: |
          # No ground truth for Juice Shop (hundreds of issues, no black-box
          # enumerable list), so this is a raw-coverage comparison only.
          benchmarks/run.sh \
            --target juice-shop \
            --url http://127.0.0.1:3000 \
            --bulwark-image bulwark-cli:bench \
            --outdir benchmarks/results

      - name: Publish to job summary
        if: always()
        run: |
          {
            echo "# Bulwark benchmark results"
            echo
            echo "_Generated by the Benchmark workflow on $(date -u)._"
            echo
            for f in benchmarks/results/*.md; do
              [ -f "$f" ] && cat "$f" && echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/

      - name: Cleanup
        if: always()
        run: docker rm -f juice || true
