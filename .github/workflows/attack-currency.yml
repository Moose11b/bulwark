name: ATT&CK currency

# Validates the playbook against the latest MITRE ATT&CK Enterprise release.
# Runs weekly and on demand; fails if a shipped technique was revoked or
# renumbered (deprecations are reported but don't fail unless run with --strict).
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  currency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (engine only — no deps)
        run: pip install -e .
      - name: Check playbook against latest ATT&CK
        run: python -m siege_tower.attack_sync --fetch
