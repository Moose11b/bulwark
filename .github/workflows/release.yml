# Builds the lean Bulwark CLI image and publishes it to GitHub Container
# Registry, then moves the major-version tag (v1) so `uses: moose11b/bulwark@v1`
# always resolves to the latest v1.x release.
#
# Trigger: push a semver tag, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write      # create GitHub Releases + move the major tag
  packages: write      # push to GHCR

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version variables
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"                 # e.g. v1.2.3
          MAJOR="${TAG%%.*}"                        # e.g. v1
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CLI image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.cli
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/moose11b/bulwark-cli:latest
            ghcr.io/moose11b/bulwark-cli:${{ steps.vars.outputs.tag }}
            ghcr.io/moose11b/bulwark-cli:${{ steps.vars.outputs.major }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BULWARK_VERSION=${{ steps.vars.outputs.version }}

      - name: Move major-version Action tag
        # So `uses: moose11b/bulwark@v1` always points at the newest v1.x
        run: |
          MAJOR="${{ steps.vars.outputs.major }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR"
          git push origin -f "$MAJOR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "Bulwark ${{ steps.vars.outputs.tag }}"
          body: |
            ## Bulwark ${{ steps.vars.outputs.tag }}

            DAST pipeline gate — dynamic security scanning for CI/CD.

            ### Container image
            ```
            ghcr.io/moose11b/bulwark-cli:${{ steps.vars.outputs.tag }}
            ghcr.io/moose11b/bulwark-cli:${{ steps.vars.outputs.major }}
            ghcr.io/moose11b/bulwark-cli:latest
            ```

            ### GitHub Action
            ```yaml
            - uses: moose11b/bulwark@${{ steps.vars.outputs.major }}
              with:
                target: http://localhost:3000
                fail-on: high
            ```

            See the [README](https://github.com/moose11b/bulwark#readme) for full usage.
